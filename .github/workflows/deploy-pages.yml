name: Deploy GitHub Pages

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      startsWith(github.event.head_commit.message, '[d]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: flutter pub get

      - name: Build website
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          USE_TEST_DATA: ${{ vars.USE_TEST_DATA || 'true' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --base-href "${PAGES_BASE_PATH}/" \
            --dart-define="USE_TEST_DATA=${USE_TEST_DATA}" \
            --dart-define="SUPABASE_URL=${SUPABASE_URL}" \
            --dart-define="SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"

      - name: Support direct links on GitHub Pages
        run: cp build/web/index.html build/web/404.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
